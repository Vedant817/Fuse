# Foundry (https://github.com/SigNoz/foundry) casting file — the checked-in
# source of truth for the self-hosted SigNoz stack. Regenerate the actual
# Docker Compose files with `foundryctl forge -f casting.yaml` (or bring the
# stack up directly with `foundryctl cast -f casting.yaml`); both write into
# ./pours/, which is git-ignored generated output, not hand-edited.
#
# Image versions are pinned explicitly (not `:latest`) per AGENTS.md's
# dependency-pinning requirement, verified against the actual upstream
# release tags at the time this was written:
#   signoz/signoz                v0.133.0
#   signoz/signoz-otel-collector v0.144.6
#   clickhouse/clickhouse-server  25.12.5 (Foundry's own pinned default)
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  signoz:
    spec:
      image: signoz/signoz:v0.133.0
  ingester:
    spec:
      image: signoz/signoz-otel-collector:v0.144.6
