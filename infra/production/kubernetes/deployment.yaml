apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuse-control-plane
spec:
  # Detector observations carry their complete bounded trailing window, so
  # either replica can make the same decision. Breaker transitions remain
  # serialized and idempotent in PostgreSQL.
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fuse-control-plane
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fuse-control-plane
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: fuse-control-plane
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fuse-control-plane
              app.kubernetes.io/component: control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/vedant817/fuse-control-plane
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            # Required shared limiter store. Keep credentials in the existing
            # externally-managed Secret, never in the ConfigMap.
            - name: CONTROL_PLANE_RATE_LIMIT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: fuse-control-plane-runtime-secrets
                  key: rate-limit-redis-url
          envFrom:
            - configMapRef:
                name: fuse-control-plane
            # Must include CONTROL_PLANE_PREFLIGHT_EXPORTER_TOKENS as an
            # independently generated exact-scope credential list. Production
            # startup rejects a missing, partial, wildcard, or reused value.
            - secretRef:
                name: fuse-control-plane-runtime-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: '1'
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: detector-policy
              mountPath: /etc/fuse/policies
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 2
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: detector-policy
          configMap:
            name: fuse-detector-policy
