apiVersion: batch/v1
kind: Job
metadata:
  name: fuse-control-plane-migrate
  namespace: fuse-system
  labels:
    app.kubernetes.io/name: fuse-control-plane
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fuse-control-plane
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/vedant817/fuse-control-plane:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - node
            - node_modules/@fuse/breaker-store/dist/migrate.js
          envFrom:
            - secretRef:
                name: fuse-control-plane-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
