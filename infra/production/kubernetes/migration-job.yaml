apiVersion: batch/v1
kind: Job
metadata:
  name: fuse-control-plane-migrate
  namespace: fuse-system
  labels:
    app.kubernetes.io/name: fuse-control-plane-migration
    app.kubernetes.io/component: migration
spec:
  # This standalone manifest runs immediately. The Kustomize base patches it
  # suspended because plain kubectl apply cannot safely order it before pods.
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fuse-control-plane-migration
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: fuse-control-plane-migration
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/vedant817/fuse-control-plane
          imagePullPolicy: IfNotPresent
          command:
            - node
            - node_modules/@fuse/breaker-store/dist/migrate.js
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fuse-control-plane-migration-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
