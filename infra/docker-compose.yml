name: fuse

services:
  postgres:
    image: postgres:16-alpine
    container_name: fuse-postgres
    environment:
      POSTGRES_USER: fuse
      POSTGRES_PASSWORD: fuse
      POSTGRES_DB: fuse
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fuse -d fuse']
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
