      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: '#/components/schemas/PreflightReportRequest' } }
      responses:
        '200':
          description: Committed Preflight state after evaluating this report
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/PreflightResponse' } }
