openapi: 3.0.3
info:
  title: Fuse control-plane API
  version: '1'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: >-
    Control-plane contract for scope registration, pre-call permits, direct
    detector enforcement, Preflight telemetry health, breaker operations,
    epoch-bound SigNoz fallback, diagnosis operations, and Slack callbacks.
    Runtime validation is implemented with Zod; this document is not used for
    server-side code generation. Every route except the unauthenticated health
    and readiness probes is subject to the global rate limit. The Slack callback
    uses Slack HMAC authentication rather than bearer authentication.
servers:
  - url: https://{host}
    description: TLS-terminated production endpoint
    variables:
      host:
        default: fuse.example.com
        description: Replace with the deployed ingress hostname

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Bearer tokens have operator/agent/exporter-evidence/webhook roles based
        on their env-var list. Production agent and exporter-evidence
        credentials bind an exact tenant, environment, and agentId and cannot
        reuse the same raw token. Operator and webhook entries may use
        `tenant:token` or an explicit plain wildcard. A role-correct token
        used against another scope, or a token used against the wrong role,
        gets 403.
    slackSignature:
      type: apiKey
      in: header
      name: X-Slack-Signature
      description: >-
        Slack HMAC SHA-256 signature over the exact request body. The required
        X-Slack-Request-Timestamp header is also checked against the replay
        window before any action is accepted.

  schemas:
    Scope:
      type: object
      required: [tenant, environment, agentId]
      properties:
        tenant: { type: string, minLength: 1 }
        environment: { type: string, minLength: 1 }
        agentId: { type: string, minLength: 1 }

    Actor:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [system, manual, policy] }
        id: { type: string, minLength: 1 }

    DiagnosisJobStatus:
      type: string
      enum: [pending, running, succeeded, dead-letter]

    DiagnosisJob:
      type: object
      required:
        [
          auditEventId,
          scope,
          detector,
          measurement,
          reason,
          correlationId,
          startsAt,
          tripEpoch,
          notifySlack,
          status,
          attempts,
          availableAt,
          leasedBy,
          leasedUntil,
          lastError,
          createdAt,
          updatedAt,
          completedAt,
        ]
      properties:
        auditEventId: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/Scope' }
        detector: { type: string, maxLength: 200 }
        measurement:
          type: object
          nullable: true
          required: [detectorVersion, score, threshold, windowEnd]
          properties:
            detectorVersion: { type: string, maxLength: 200 }
            score: { type: number }
            threshold: { type: number }
            windowEnd: { type: string, format: date-time }
        reason: { type: string, maxLength: 2000 }
        correlationId: { type: string, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        tripEpoch: { type: integer, minimum: 0 }
        notifySlack: { type: boolean }
        status: { $ref: '#/components/schemas/DiagnosisJobStatus' }
        attempts: { type: integer, minimum: 0, maximum: 100 }
        availableAt: { type: string, format: date-time }
        leasedBy: { type: string, nullable: true }
        leasedUntil: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    DiagnosisReplayRequest:
      type: object
      additionalProperties: false
      required: [scope, actor, reason, idempotencyKey]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        actor:
          allOf:
            - { $ref: '#/components/schemas/Actor' }
            - type: object
              properties:
                type: { type: string, enum: [manual] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }

    FuseError:
      type: object
      required: [error, message, correlationId]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - unauthenticated
            - unauthorized
            - unknown_scope
            - scope_capacity_exceeded
            - stale_epoch
            - idempotency_conflict
            - invalid_transition
            - cooldown_active
            - contention_exhausted
            - rate_limited
            - store_unavailable
            - internal_error
        message: { type: string }
        correlationId: { type: string }

    SlackCallbackError:
      type: object
      required: [error, correlationId]
      properties:
        error: { type: string, enum: [invalid_request, unauthenticated, forbidden] }
        correlationId: { type: string }

    BreakerState:
      type: string
      enum: [armed, tripped, disabled]

    PermitState:
      type: string
      enum: [armed, tripped, disabled, unknown]
      description: >-
        `unknown` only ever appears in a permit RESPONSE (store was
        unreachable) — never on a persisted BreakerRecord.

    BreakerRecord:
      type: object
      required:
        [scope, state, epoch, reason, policyVersion, cooldownUntil, updatedAt, updatedBy]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        state: { $ref: '#/components/schemas/BreakerState' }
        epoch: { type: integer, minimum: 0 }
        reason: { type: string }
        policyVersion: { type: string }
        cooldownUntil: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/Actor' }

    RegisterScopeRequest:
      type: object
      required: [scope, policyVersion, actor, reason, correlationId]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        policyVersion: { type: string, minLength: 1, maxLength: 200 }
        actor: { $ref: '#/components/schemas/Actor' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        correlationId: { type: string, minLength: 1, maxLength: 200 }

    RegisterScopeResponse:
      type: object
      required: [registration, breaker, created]
      properties:
        registration:
          type: object
          required: [scope, policyVersion, registeredAt, registeredBy, reason]
          properties:
            scope: { $ref: '#/components/schemas/Scope' }
            policyVersion: { type: string }
            registeredAt: { type: string, format: date-time }
            registeredBy: { $ref: '#/components/schemas/Actor' }
            reason: { type: string }
        breaker: { $ref: '#/components/schemas/BreakerRecord' }
        created:
          type: boolean
          description: false when this exact scope was already registered

    ResolvedDetectorPolicy:
      type: object
      required:
        [
          policyVersion,
          cooldownSeconds,
          storeOutageMode,
          controlPlaneOutageMode,
          detectors,
          notificationRoutes,
        ]
      properties:
        policyVersion: { type: string }
        cooldownSeconds: { type: integer, minimum: 0 }
        storeOutageMode: { type: string, enum: [fail-open, fail-closed] }
        controlPlaneOutageMode: { type: string, enum: [fail-open, fail-closed] }
        notificationRoutes:
          type: array
          items: { type: string, enum: [slack] }
        detectors:
          type: object
          description: Effective detector configuration after defaults and scope specificity are resolved.
          additionalProperties:
            type: object
            additionalProperties: true

    PermitRequest:
      type: object
      required: [scope, correlationId]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        correlationId: { type: string, minLength: 1, maxLength: 200 }

    PermitResponse:
      type: object
      required: [allowed, state, reason, epoch, degraded, correlationId]
      properties:
        allowed: { type: boolean }
        state: { $ref: '#/components/schemas/PermitState' }
        reason: { type: string }
        epoch: { type: integer }
        degraded:
          type: boolean
          description: 'true only when a store outage forced a fail-open/fail-closed default, not a real read'
        correlationId: { type: string }

    TripRequest:
      type: object
      required:
        [
          scope,
          reason,
          policyVersion,
          cooldownSeconds,
          actor,
          correlationId,
          idempotencyKey,
        ]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        policyVersion: { type: string, minLength: 1 }
        cooldownSeconds: { type: integer, minimum: 0 }
        actor: { $ref: '#/components/schemas/Actor' }
        correlationId: { type: string, minLength: 1, maxLength: 200 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        expectedEpoch:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: >-
            Optional optimistic-lock guard for operator force-trips. Direct
            detector and SigNoz fallback trips bind their source epoch inside
            the server implementation.

    ControlRequest:
      type: object
      required: [scope, reason, actor, correlationId, idempotencyKey, expectedEpoch]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        actor: { $ref: '#/components/schemas/Actor' }
        correlationId: { type: string, minLength: 1, maxLength: 200 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        expectedEpoch:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: >-
            Required optimistic-lock guard. Read the current breaker record and
            submit its epoch; stale actions fail with 409 stale_epoch. There is
            no force or unbound bypass.

    ResumeRequest:
      allOf:
        - { $ref: '#/components/schemas/ControlRequest' }

    DisableRequest:
      allOf:
        - { $ref: '#/components/schemas/ControlRequest' }

    EnableRequest:
      allOf:
        - { $ref: '#/components/schemas/ControlRequest' }

    TransitionResponse:
      type: object
      required: [record, auditEvent, noop]
      properties:
        record: { $ref: '#/components/schemas/BreakerRecord' }
        auditEvent:
          type: object
          description: 'the persisted breaker_audit_log row for this transition'
        noop: { type: boolean }

    BreakerStatusResponse:
      type: object
      required: [record]
      properties:
        record: { $ref: '#/components/schemas/BreakerRecord' }

    DetectorResult:
      type: object
      required:
        [
          detector,
          detectorVersion,
          scope,
          fired,
          score,
          threshold,
          windowStart,
          windowEnd,
          evidence,
          dedupeKey,
        ]
      properties:
        detector: { type: string, enum: [loop-signature, context-bloat, cost-velocity] }
        detectorVersion: { type: string }
        scope: { $ref: '#/components/schemas/Scope' }
        fired: { type: boolean }
        score: { type: number }
        threshold: { type: number }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        evidence: { type: array, items: { type: string } }
        dedupeKey: { type: string }

    AvailablePricedStepObservation:
      type: object
      required:
        [
          executionId,
          timestampMs,
          canonicalShape,
          inputTokens,
          outputTokens,
          pricingStatus,
          estimatedCostUsd,
        ]
      properties:
        executionId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        timestampMs: { type: integer, minimum: 0 }
        canonicalShape: { type: string, minLength: 1 }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        pricingStatus: { type: string, enum: [available] }
        estimatedCostUsd: { type: number, minimum: 0 }

    UnavailablePricedStepObservation:
      type: object
      required:
        [
          executionId,
          timestampMs,
          canonicalShape,
          inputTokens,
          outputTokens,
          pricingStatus,
          estimatedCostUsd,
        ]
      properties:
        executionId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        timestampMs: { type: integer, minimum: 0 }
        canonicalShape: { type: string, minLength: 1 }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        pricingStatus: { type: string, enum: [unavailable] }
        estimatedCostUsd: { type: number, nullable: true, enum: [null] }

    StepObservation:
      oneOf:
        - { $ref: '#/components/schemas/AvailablePricedStepObservation' }
        - { $ref: '#/components/schemas/UnavailablePricedStepObservation' }

    ObserveStepsRequest:
      type: object
      required: [scope, steps]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        steps:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/StepObservation' }

    ObserveStepsResponse:
      type: object
      required: [results, enforcement]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/DetectorResult' }
        enforcement:
          type: array
          items:
            type: object
            required: [detector, outcome]
            properties:
              detector:
                type: string
                enum: [loop-signature, context-bloat, cost-velocity]
              outcome:
                type: string
                enum: [tripped, already-tripped, breaker-disabled]

    SpanTelemetrySample:
      type: object
      required:
        [
          timestampMs,
          hasRequestModel,
          hasInputTokens,
          hasOutputTokens,
          hasScopedIdentity,
          hasValidTimestamps,
          isRootSpan,
          hasParent,
        ]
      properties:
        timestampMs: { type: integer, minimum: 0 }
        hasRequestModel: { type: boolean }
        hasInputTokens: { type: boolean }
        hasOutputTokens: { type: boolean }
        hasScopedIdentity: { type: boolean }
        hasValidTimestamps: { type: boolean }
        isRootSpan: { type: boolean }
        hasParent: { type: boolean }

    PreflightReportRequest:
      type: object
      additionalProperties: false
      required: [scope, spans]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        spans:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/SpanTelemetrySample' }
        heartbeat:
          type: object
          properties:
            lastSeenAtMs: { type: integer, minimum: 0 }
        revalidate:
          type: boolean
          description: >-
            Re-evaluate persisted evidence against the current clock. When
            true, spans must be empty and no other signal or disabled-state
            field may be supplied.
        disabled: { type: boolean }
        disabledReason: { type: string, maxLength: 2000 }

    ExporterDeliverySignal:
      type: object
      additionalProperties: false
      required: [status, observedAtMs, sourceInstanceId, sequence]
      properties:
        status: { type: string, enum: [success, failure] }
        observedAtMs: { type: integer, minimum: 0 }
        sourceInstanceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        sequence: { type: integer, minimum: 1 }

    PreflightExporterEvidenceRequest:
      type: object
      additionalProperties: false
      required: [scope, spans, exporterDelivery]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        spans:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/SpanTelemetrySample' }
        exporterDelivery:
          $ref: '#/components/schemas/ExporterDeliverySignal'

    PreflightResult:
      type: object
      required:
        [
          scope,
          state,
          reasonCode,
          reason,
          evaluatedAt,
          lastGoodAt,
          requiredFieldCoveragePercent,
          orphanRatePercent,
          freshnessMs,
          pendingRecoveryState,
          pendingSince,
        ]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        state: { type: string, enum: [protected, degraded, blind, disabled] }
        reasonCode: { type: string }
        reason: { type: string }
        evaluatedAt: { type: string, format: date-time }
        lastGoodAt: { type: string, format: date-time, nullable: true }
        requiredFieldCoveragePercent: { type: number, minimum: 0, maximum: 100 }
        orphanRatePercent: { type: number, minimum: 0, maximum: 100 }
        freshnessMs: { type: number, minimum: 0, nullable: true }
        pendingRecoveryState:
          type: string
          enum: [protected, degraded, blind, disabled]
          nullable: true
        pendingSince: { type: string, format: date-time, nullable: true }

    PreflightResponse:
      type: object
      required: [result]
      properties:
        result: { $ref: '#/components/schemas/PreflightResult' }

    SignozAlertmanagerWebhookPayload:
      type: object
      required: [status, alerts]
      description: 'the Prometheus Alertmanager webhook contract SigNoz follows — see packages/contracts/src/alert-webhook.ts'
      properties:
        version: { type: string }
        groupKey: { type: string }
        truncatedAlerts: { type: integer, minimum: 0 }
        status: { type: string, enum: [firing, resolved] }
        receiver: { type: string }
        groupLabels: { type: object, additionalProperties: { type: string } }
        commonLabels: { type: object, additionalProperties: { type: string } }
        commonAnnotations: { type: object, additionalProperties: { type: string } }
        externalURL: { type: string }
        alerts:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [status, labels, startsAt, fingerprint]
            properties:
              status: { type: string, enum: [firing, resolved] }
              labels:
                type: object
                additionalProperties: { type: string }
                description: >-
                  Firing fallback alerts need scope labels, fuse.detector, and
                  a canonical fuse.source_epoch (dotted or underscored aliases
                  are normalized). Missing/invalid source epochs are accepted
                  only as non-enforcing unbound-alert outcomes.
              annotations: { type: object, additionalProperties: { type: string } }
              startsAt: { type: string }
              endsAt: { type: string }
              generatorURL: { type: string }
              fingerprint: { type: string, minLength: 1 }

  responses:
    BadRequest:
      description: Malformed body (schema validation failed)
      content:
        application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
    Unauthenticated:
      description: Missing or invalid bearer token
      content:
        application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
    Unauthorized:
      description: A valid token, but not authorized for this route/tenant
      content:
        application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
    TooManyRequests:
      description: Global rate limit exceeded (CONTROL_PLANE_RATE_LIMIT_MAX/_WINDOW_MS)
      content:
        application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
    InternalError:
      description: Unexpected server error; the response never includes a stack or secret
      content:
        application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
    StoreUnavailable:
      description: >-
        Required request storage is unavailable. This includes the shared Redis
        global rate-limit store before route handling and route-specific
        PostgreSQL storage. The request fails closed with 503 and is not reported
        as a fabricated success.
      content:
        application/json: { schema: { $ref: '#/components/schemas/FuseError' } }

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe — no dependency checks
      security: []
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [status],
                  properties: { status: { type: string, enum: [ok] } },
                }
        '500': { $ref: '#/components/responses/InternalError' }

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe - checks Redis, PostgreSQL, and the complete required schema
      security: []
      responses:
        '200':
          description: Rate-limit Redis and PostgreSQL reachable; migrations 0001 through 0008 present
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [status],
                  properties: { status: { type: string, enum: [ready] } },
                }
        '503':
          description: Redis/PostgreSQL unreachable or schema stale - stop routing here
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status: { type: string, enum: [not-ready] }
                  reason:
                    {
                      type: string,
                      enum:
                        [
                          rate_limit_store_unavailable,
                          store_unavailable,
                          schema_not_ready,
                        ],
                    }
                  dependency: { type: string, enum: [redis] }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/scopes/register:
    post:
      operationId: postScopeRegister
      summary: Register and initialize an allowed scope (operator-only)
      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: '#/components/schemas/RegisterScopeRequest' } }
      responses:
        '200':
          description: Existing registration returned unchanged
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/RegisterScopeResponse' } }
        '201':
          description: Scope registered and armed breaker initialized
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/RegisterScopeResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Per-tenant registered-scope capacity reached
          content:
            application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

  /v1/policies/effective:
    get:
      operationId: getEffectivePolicy
      summary: Inspect the effective detector policy for a registered scope (operator-only)
      parameters:
        - { name: tenant, in: query, required: true, schema: { type: string } }
        - { name: environment, in: query, required: true, schema: { type: string } }
        - { name: agentId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Policy loaded by this replica
          content:
            application/json:
              schema:
                type: object
                required: [scope, policy]
                properties:
                  scope: { $ref: '#/components/schemas/Scope' }
                  policy: { $ref: '#/components/schemas/ResolvedDetectorPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Scope has not been registered by an operator
          content:
            application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

  /v1/permit:
    post:
      operationId: postPermit
      summary: Check whether a guarded LLM call may proceed
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PermitRequest' } }
      responses:
        '200':
          description: Permit decision (allowed may be true even for a degraded/fail-open outage response)
          content:
            application/json: { schema: { $ref: '#/components/schemas/PermitResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Scope has not been registered by an operator
          content:
            application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
        '503': { $ref: '#/components/responses/StoreUnavailable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/breaker/trip:
    post:
      operationId: postBreakerTrip
      summary: Force-trip a scope (operator-only)
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TripRequest' } }
      responses:
        '200':
          description: Transition applied (or a same-idempotency-key no-op replay)
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/TransitionResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Scope has not been registered by an operator
          content:
            application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
        '409':
          description: idempotency_conflict / stale_epoch / invalid_transition
          content:
