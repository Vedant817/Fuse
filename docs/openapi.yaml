      operationId: postDetectorsObserve
      summary: Report step telemetry for real-time detector evaluation (agent-tier token)
      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: '#/components/schemas/ObserveStepsRequest' } }
      responses:
        '200':
          description: The three detectors' results after processing every step in the request
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ObserveStepsResponse' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Scope has not been registered by an operator
          content:
            application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
        '409':
          description: Detector trip contention could not be resolved; retry
          content:
            application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

  /v1/diagnosis/jobs:
    get:
      operationId: listDiagnosisJobs
      summary: List diagnosis delivery jobs (operator-only and tenant-bound)
      parameters:
        - {
            in: query,
            name: tenant,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
        - { in: query, name: environment, schema: { type: string, maxLength: 64 } }
        - { in: query, name: agentId, schema: { type: string, maxLength: 128 } }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/DiagnosisJobStatus' }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { in: query, name: cursor, schema: { type: string, maxLength: 512 } }
      responses:
        '200':
          description: Stable keyset-paginated diagnosis jobs for the authorized tenant
          content:
            application/json:
              schema:
                type: object
                required: [jobs, nextCursor]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/DiagnosisJob' }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

  /v1/diagnosis/jobs/{auditEventId}/replay:
    post:
      operationId: replayDiagnosisJob
      summary: Requeue one dead-letter diagnosis job with audited operator attribution
      parameters:
        - in: path
          name: auditEventId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnosisReplayRequest' }
      responses:
        '200':
          description: Job requeued, or the same idempotent replay result returned
          content:
            application/json:
              schema:
                type: object
                required: [job, replayed]
                properties:
                  job: { $ref: '#/components/schemas/DiagnosisJob' }
                  replayed: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No job exists for the supplied tenant/environment/agent scope
          content:
            application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
        '409':
          description: Job is live/succeeded, or the idempotency key conflicts
          content:
            application/json: { schema: { $ref: '#/components/schemas/FuseError' } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

  /v1/webhooks/signoz:
    post:
      operationId: postWebhooksSignoz
      summary: >-
        SigNoz Alertmanager-compatible epoch-bound fallback (webhook-tier
        token; scope and source breaker epoch come from alert labels)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignozAlertmanagerWebhookPayload' }
      responses:
        '200':
          description: >-
            Always 200 even for a per-alert outcome of unknown-scope,
            stale-alert, or already-tripped/breaker-disabled — a webhook
            delivery is acknowledged once parsed, regardless of what each
            contained alert individually resolved to
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, results]
                properties:
                  correlationId: { type: string }
                  results:
                    type: array
                    items:
                      { type: object, description: 'per-alert outcome, see webhook.ts' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }

  /v1/slack/interactive:
    post:
      operationId: postSlackInteractive
      summary: >-
        Slack's interactive-component callback (block_actions / view_submission)
        — authenticated by Slack's own HMAC request signature, NOT a bearer
        token (see docs/adr/007-signoz-mcp-diagnosis.md and
        slack-actions.ts)
      security:
        - slackSignature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                payload:
                  {
                    type: string,
                    description: 'URL-encoded JSON Slack interactive payload',
                  }
      responses:
        '200':
          description: 'Acknowledged (modal opened, or resume executed)'
        '401':
          description: >-
            Missing/invalid X-Slack-Signature, or a stale
            X-Slack-Request-Timestamp — fail-closed on either
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/SlackCallbackError' } }
        '403':
          description: Signed request from a user or workspace not authorized to resume
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/SlackCallbackError' } }
        '400':
          description: Missing or malformed Slack form payload
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/SlackCallbackError' } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StoreUnavailable' }
